# Dependabot — pemindai kerentanan & pembaruan dependency otomatis (gratis).
# Membuka PR mingguan untuk update npm + GitHub Actions, dan PR keamanan segera
# saat ada CVE pada dependency. Group update minor/patch agar tidak banjir PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
